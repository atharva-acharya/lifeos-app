name: Release

# Three jobs (ADR 0007, threat model T22):
#   gates   - CodeQL (Rust) and the owner's local e2e run passed on this commit
#   build   - builds the installers with no secrets and no write access
#   publish - signs the update package and publishes; it runs none of the
#             repository's code or dependencies, so the update-signing key is
#             never exposed to build scripts.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  gates:
    name: Release gates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      checks: read
      statuses: read
    steps:
      # CodeQL for Rust is not a required PR check (it is slow), so a release
      # only goes out once it has passed on the exact commit being tagged.
      - name: Require CodeQL (rust) to have passed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          result=$(gh api "repos/$REPO/commits/$SHA/check-runs?check_name=CodeQL%20(rust)" \
            --jq '[.check_runs[] | select(.status == "completed")] | sort_by(.completed_at) | last | .conclusion')
          echo "CodeQL (rust) on $SHA: ${result:-not run}"
          [ "$result" = "success" ]

      # The end-to-end suite needs WebView2, which hosted runners cannot start,
      # so the owner runs it (`pnpm e2e:gate`) and it records a commit status.
      # Only a status the owner created counts.
      - name: Require the owner's end-to-end run to have passed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          OWNER: ${{ github.repository_owner }}
        run: |
          state=$(gh api "repos/$REPO/commits/$SHA/statuses" \
            --jq "[.[] | select(.context == \"e2e (local)\" and .creator.login == \"$OWNER\")] | first | .state")
          echo "e2e (local) by $OWNER on $SHA: ${state:-not run}"
          [ "$state" = "success" ]

  build:
    name: Build installers
    needs: gates
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      tauri-cli: ${{ steps.cli.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check versions match the tag
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          want="${TAG#v}"
          pkg=$(node -p "require('./package.json').version")
          conf=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cargo=$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d'"' -f2)
          echo "tag=$want package.json=$pkg tauri.conf.json=$conf Cargo.toml=$cargo"
          [ "$pkg" = "$want" ] && [ "$conf" = "$want" ] && [ "$cargo" = "$want" ]

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Tauri CLI version (the publish job signs with the same one)
        id: cli
        shell: bash
        run: echo "version=$(node -p "require('@tauri-apps/cli/package.json').version")" >> "$GITHUB_OUTPUT"

      # Update signing happens in the publish job, so no key is needed here.
      - name: Build installers
        shell: bash
        run: pnpm tauri build --config '{"bundle":{"createUpdaterArtifacts":false}}' -- --locked

      # Authenticode signing via SignPath is added here once the project is
      # accepted into its open-source programme (ADR 0005).

      - name: Collect artefacts
        shell: bash
        run: |
          mkdir -p dist-release
          cp src-tauri/target/release/bundle/nsis/*.exe dist-release/
          # GitHub replaces spaces in asset names with dots; match it so SHA256SUMS.txt checks.
          for f in dist-release/*' '*; do mv "$f" "${f// /.}"; done
          ls -l dist-release

      - name: SBOM (CycloneDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: dist-release/sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Changelog
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: dist-release/CHANGES.md

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: dist-release/
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Sign and publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist-release

      # Only the pinned Tauri CLI runs here, installed without install scripts;
      # no repository code or other dependencies, so the key stays contained.
      - name: Sign the update package (bound to this version)
        env:
          TAG: ${{ github.ref_name }}
          CLI_VERSION: ${{ needs.build.outputs.tauri-cli }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npm install --prefix "$RUNNER_TEMP/signer" --no-save --ignore-scripts --no-audit --no-fund \
            "@tauri-apps/cli@$CLI_VERSION"
          exe=$(ls dist-release/*-setup.exe)
          "$RUNNER_TEMP/signer/node_modules/.bin/tauri" signer sign --app-version "${TAG#v}" "$exe"
          test -s "$exe.sig"

      - name: Update manifest (latest.json)
        env:
          TAG: ${{ github.ref_name }}
        run: |
          exe=$(ls dist-release/*-setup.exe)
          EXE_NAME=$(basename "$exe") SIGNATURE=$(cat "$exe.sig") node -e '
            const { TAG, EXE_NAME, SIGNATURE, GITHUB_REPOSITORY } = process.env;
            const manifest = {
              version: TAG.replace(/^v/, ""),
              notes: "See the release notes on GitHub.",
              pub_date: new Date().toISOString(),
              platforms: {
                "windows-x86_64": {
                  signature: SIGNATURE,
                  url: `https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${EXE_NAME}`,
                },
              },
            };
            process.stdout.write(JSON.stringify(manifest, null, 2) + "\n");
          ' > dist-release/latest.json
          cat dist-release/latest.json

      - name: Checksums
        working-directory: dist-release
        run: |
          mv CHANGES.md "$RUNNER_TEMP/CHANGES.md"
          sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist-release/*.exe
            dist-release/latest.json
            dist-release/sbom.cdx.json

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          {
            cat "$RUNNER_TEMP/CHANGES.md"
            echo
            echo "## Verify"
            echo
            echo '```'
            echo "gh attestation verify <file> --repo ${GITHUB_REPOSITORY}"
            echo '```'
            echo
            echo "The installer is not yet code-signed, so Windows SmartScreen may warn. Check the SHA-256 and attestation above."
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" dist-release/* --repo "$GITHUB_REPOSITORY" \
            --title "Life OS $TAG" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
