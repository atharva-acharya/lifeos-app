name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: windows-latest
    timeout-minutes: 60
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check versions match the tag
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          want="${TAG#v}"
          pkg=$(node -p "require('./package.json').version")
          conf=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cargo=$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d'"' -f2)
          echo "tag=$want package.json=$pkg tauri.conf.json=$conf Cargo.toml=$cargo"
          [ "$pkg" = "$want" ] && [ "$conf" = "$want" ] && [ "$cargo" = "$want" ]

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Build installers
        run: pnpm tauri build -- --locked

      # Authenticode signing via SignPath is added here once the project is
      # accepted into its open-source programme (ADR 0005).

      - name: Collect artefacts
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist-release
          cp src-tauri/target/release/bundle/nsis/*.exe dist-release/
          cp src-tauri/target/release/bundle/msi/*.msi dist-release/
          ls -l dist-release

      - name: SBOM (CycloneDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: dist-release/sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Checksums
        shell: bash
        working-directory: dist-release
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist-release/*.exe
            dist-release/*.msi
            dist-release/sbom.cdx.json

      - name: Changelog
        id: changelog
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: CHANGES.md

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          {
            cat CHANGES.md
            echo
            echo "## Verify"
            echo
            echo '```'
            echo "gh attestation verify <file> --repo ${GITHUB_REPOSITORY}"
            echo '```'
            echo
            echo "The installer is not yet code-signed, so Windows SmartScreen may warn. Check the SHA-256 and attestation above."
          } > notes.md
          gh release create "$TAG" dist-release/* --title "Life OS $TAG" --notes-file notes.md --verify-tag
