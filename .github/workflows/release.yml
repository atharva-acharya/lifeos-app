name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: windows-latest
    timeout-minutes: 60
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
      checks: read
      statuses: read
    steps:
      # CodeQL for Rust is not a required PR check (it is slow), so a release
      # only goes out once it has passed on the exact commit being tagged.
      - name: Require CodeQL (rust) to have passed on this commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          result=$(gh api "repos/$REPO/commits/$SHA/check-runs?check_name=CodeQL%20(rust)" --jq '[.check_runs[] | select(.status == "completed")] | sort_by(.completed_at) | last | .conclusion')
          echo "CodeQL (rust) on $SHA: ${result:-not run}"
          [ "$result" = "success" ]

      # The end-to-end suite needs WebView2, which hosted runners cannot start,
      # so it runs on the owner's PC (`pnpm e2e:gate`) and records a commit
      # status. No release without it passing on this exact commit.
      - name: Require the local end-to-end suite to have passed on this commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          state=$(gh api "repos/$REPO/commits/$SHA/statuses" \
            --jq '[.[] | select(.context == "e2e (local)")] | first | .state')
          echo "e2e (local) on $SHA: ${state:-not run}"
          [ "$state" = "success" ]

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check versions match the tag
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          want="${TAG#v}"
          pkg=$(node -p "require('./package.json').version")
          conf=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cargo=$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d'"' -f2)
          echo "tag=$want package.json=$pkg tauri.conf.json=$conf Cargo.toml=$cargo"
          [ "$pkg" = "$want" ] && [ "$conf" = "$want" ] && [ "$cargo" = "$want" ]

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Build installers
        env:
          # Signs the update packages; the app only installs updates signed
          # with this key (public half in tauri.conf.json, ADR 0007).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build -- --locked

      # Authenticode signing via SignPath is added here once the project is
      # accepted into its open-source programme (ADR 0005).

      - name: Collect artefacts
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist-release
          cp src-tauri/target/release/bundle/nsis/*.exe src-tauri/target/release/bundle/nsis/*.exe.sig dist-release/
          cp src-tauri/target/release/bundle/msi/*.msi dist-release/
          # GitHub replaces spaces in asset names with dots; match it so SHA256SUMS.txt checks.
          for f in dist-release/*' '*; do mv "$f" "${f// /.}"; done
          # Update manifest the app reads from releases/latest/download/latest.json.
          exe=$(ls dist-release/*-setup.exe)
          EXE_NAME=$(basename "$exe") SIGNATURE=$(cat "$exe.sig") node -e '
            const { TAG, EXE_NAME, SIGNATURE, GITHUB_REPOSITORY } = process.env;
            const manifest = {
              version: TAG.replace(/^v/, ""),
              notes: "See the release notes on GitHub.",
              pub_date: new Date().toISOString(),
              platforms: {
                "windows-x86_64": {
                  signature: SIGNATURE,
                  url: `https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${EXE_NAME}`,
                },
              },
            };
            process.stdout.write(JSON.stringify(manifest, null, 2) + "\n");
          ' > dist-release/latest.json
          cat dist-release/latest.json
          ls -l dist-release

      - name: SBOM (CycloneDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: dist-release/sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Checksums
        shell: bash
        working-directory: dist-release
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist-release/*.exe
            dist-release/*.msi
            dist-release/latest.json
            dist-release/sbom.cdx.json

      - name: Changelog
        id: changelog
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: CHANGES.md

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          {
            cat CHANGES.md
            echo
            echo "## Verify"
            echo
            echo '```'
            echo "gh attestation verify <file> --repo ${GITHUB_REPOSITORY}"
            echo '```'
            echo
            echo "The installer is not yet code-signed, so Windows SmartScreen may warn. Check the SHA-256 and attestation above."
          } > notes.md
          gh release create "$TAG" dist-release/* --title "Life OS $TAG" --notes-file notes.md --verify-tag
