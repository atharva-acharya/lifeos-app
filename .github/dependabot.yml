version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    groups:
      npm-minor:
        update-types: [minor, patch]
  - package-ecosystem: cargo
    directory: /src-tauri
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    groups:
      cargo-minor:
        update-types: [minor, patch]
