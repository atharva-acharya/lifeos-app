[package]
name = "lifeos-app"
version = "0.4.0"
description = "Desktop dashboards and editor for a Markdown Life OS vault"
authors = ["Atharva Acharya"]
license = "MIT"
repository = "https://github.com/atharva-acharya/lifeos-app"
rust-version = "1.95"
edition = "2024"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "lifeos_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
thiserror = "2"
rfd = { version = "0.17", default-features = false, features = ["common-controls-v6"] }
yaml-rust2 = "0.13"
rusqlite = { version = "0.41", features = ["bundled"] }
notify = "8"
notify-debouncer-mini = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
keyring = { version = "3", features = ["windows-native"] }
sha2 = "0.10"
base64 = "0.22"
rand = "0.9"
open = "5"
tauri-plugin-updater = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "warn"

[dev-dependencies]
proptest = "1"
tempfile = "3"
